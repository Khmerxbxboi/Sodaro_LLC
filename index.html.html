<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sodaro — Oakland Storefront Builder</title>
<style>
:root{--bg:#070d15;--panel:#111d2b;--panel2:#0c1723;--line:#2c3e51;--text:#f4f8fc;--muted:#a6b5c5;--cyan:#12c9f2;--green:#8be6bf;--pink:#e8a1e7;--gold:#ffd486}
*{box-sizing:border-box}
body{margin:0;background:#060a10;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.shell{max-width:480px;min-height:100vh;margin:auto;position:relative;background:radial-gradient(circle at 100% 0,rgba(18,201,242,.08),transparent 20rem),var(--bg);border-inline:1px solid rgba(255,255,255,.04);padding-bottom:25px}
.page{padding:18px 19px 34px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.logo-big{width:min(260px,75vw);height:auto;display:block;margin:0 auto 25px;border-radius:16px}
.logo-small{width:74px;height:52px;object-fit:contain;object-position:center;border-radius:8px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}
.brand{display:flex;align-items:center;gap:10px}
.brand strong{letter-spacing:.14em;font-size:.95rem}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--cyan);background:#133043;border:1px solid #286279;font-weight:900}
.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#142233,#101a27);padding:17px;margin:13px 0}
.card.cyan{border-color:#276579;background:linear-gradient(140deg,#123747,#111d2b 72%)}
.card.pink{border-color:#64456a;background:linear-gradient(140deg,#39253b,#111d2b 75%)}
h1,h2,h3,p{margin-top:0}
h1{font-size:1.85rem;line-height:1.12;letter-spacing:-.045em;margin-bottom:9px}
h2{font-size:1.2rem;line-height:1.25;margin-bottom:8px}
h3{font-size:.98rem;margin-bottom:7px}
p{color:var(--muted);line-height:1.5}
.eyebrow{color:var(--cyan);font-size:.71rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
.sub{font-size:.94rem;margin-bottom:17px}
.small{font-size:.78rem}
.tiny{font-size:.7rem}
.note{font-size:.74rem;line-height:1.45;color:#92a3b5}
.field{margin:13px 0}
label{display:block;color:#d9e4ee;font-size:.82rem;font-weight:750;margin-bottom:7px}
input,textarea{width:100%;border:1px solid #364a60;background:#09131e;color:var(--text);border-radius:12px;padding:13px;outline:none}
textarea{min-height:75px;resize:vertical}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(18,201,242,.12)}
input::placeholder,textarea::placeholder{color:#74869a}
.btn{width:100%;min-height:51px;border:0;border-radius:14px;background:var(--cyan);color:#04212b;font-weight:900;padding:13px 16px}
.btn:hover{filter:brightness(1.07)}
.btn.secondary{background:#182638;color:var(--text);border:1px solid #36495c}
.btn.small{width:auto;min-height:38px;padding:8px 12px;font-size:.76rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rowtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.kicker{font-size:.74rem;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:#27374a;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#79eac8);border-radius:inherit}
.stepnum{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:#0d2b39;color:var(--cyan);border:1px solid #28677b;font-weight:900}
.stephead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 13px}
.stephead button{background:transparent;border:0;color:var(--muted);padding:8px 0;font-weight:750}
.stephead span{font-size:.7rem;color:var(--cyan);font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.picks{display:grid;gap:8px;margin:12px 0}
.pick{width:100%;border:1px solid #33475c;border-radius:13px;background:#0c1723;color:var(--text);padding:12px;text-align:left;display:flex;gap:10px;align-items:center}
.pick.active{border-color:var(--cyan);background:#0e2b37;box-shadow:inset 0 0 0 1px rgba(18,201,242,.18)}
.dot{width:18px;height:18px;border:2px solid #718499;border-radius:50%;flex:none}
.pick.active .dot{border:6px solid var(--cyan)}
.pick strong{display:block;font-size:.84rem}
.pick small{display:block;color:var(--muted);font-size:.71rem;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #3b4c60;background:#0b1622;color:#dce6ef;border-radius:99px;padding:9px 11px;font-size:.75rem;font-weight:750}
.chip.active{border-color:var(--cyan);background:#0d2c39;color:#a8effb}
.mapimg{width:100%;display:block;border:1px solid #334457;border-radius:14px;background:#050a10}
.mapnote{margin:9px 1px 0;font-size:.68rem}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#91eafa;text-decoration:none;border:1px solid #2d4a60;background:#0a1622;border-radius:12px;padding:11px 12px;font-size:.76rem;font-weight:800;margin:8px 0}
.link:hover{border-color:var(--cyan)}
.link span:last-child{color:var(--cyan);font-size:1rem}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border:1px solid #293b4e;border-radius:12px;background:#0b1622;margin:8px 0;color:#d8e2ec;font-size:.78rem;line-height:1.4}
.check input{appearance:none;width:18px;height:18px;padding:0;margin:0;flex:none;border:1px solid #718499;border-radius:5px;background:#101b28}
.check input:checked{background:var(--cyan);border-color:var(--cyan)}
.check input:checked:after{content:"✓";display:grid;place-items:center;color:#06232b;font-size:13px;font-weight:900}
.callout{border-left:3px solid var(--cyan);background:rgba(18,201,242,.08);padding:11px 13px;border-radius:0 12px 12px 0;color:#d2e0ec;font-size:.78rem;line-height:1.48;margin:12px 0}
.fee{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #27394b}
.fee:last-child{border-bottom:0}
.fee strong{font-size:.82rem}
.fee b{white-space:nowrap;color:#fff;font-size:.85rem}
.fee span{display:block;color:var(--muted);font-size:.7rem;line-height:1.4;margin-top:3px}
.tag{display:inline-block;border:1px solid #3b5369;background:#0c1723;color:#aabacc;border-radius:99px;font-size:.65rem;padding:4px 7px;margin-left:4px}
.tag.city{color:#9cecf8;border-color:#27677b}
.tag.state{color:#f0b4ed;border-color:#704875}
.tag.county{color:#ffdc9b;border-color:#72572e}
.total{font-size:1.65rem;font-weight:950;letter-spacing:-.04em;color:var(--green);margin:5px 0}
.banner{border:1px solid #366052;background:#10271f;border-radius:15px;padding:13px;margin:12px 0}
.banner strong{color:var(--green)}
.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.theme{border:1px solid #37495c;background:#0b1622;color:var(--text);border-radius:13px;padding:10px 5px;font-size:.72rem;font-weight:850}
.theme.active{border-color:var(--cyan);background:#102b38}
.swatches{display:flex;justify-content:center;gap:4px;margin-bottom:7px}
.swatches i{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff45}
.scene{border:1px solid #38495b;border-radius:16px;overflow:hidden;background:#0a141e;margin:12px 0}
.scene svg{width:100%;height:auto;display:block}
.empty{--wall:#e8e7df;--floor:#9c8775;--glass:#a9d9e1;--sign:#101b28;--accent:#14c8ed}
.look-warm{--wall:#f3e8d5;--floor:#b77e59;--glass:#b6e4e9;--sign:#754c3b;--accent:#db7953}
.look-bold{--wall:#e7e9ff;--floor:#7779b7;--glass:#b8e9ef;--sign:#50447f;--accent:#e5569d}
.look-calm{--wall:#e3f1ec;--floor:#79a99c;--glass:#b9e3e9;--sign:#3d746d;--accent:#e8ab50}
.practice{border:1px solid #34475b;background:#0b1622;border-radius:14px;padding:12px;margin:9px 0}
.answer{display:flex;gap:8px;margin-top:9px}
.answer button{flex:1;border:1px solid #40536a;background:#152436;color:#eef6fc;border-radius:10px;padding:9px 5px;font-size:.7rem;font-weight:800}
.good{color:var(--green)!important}.bad{color:var(--gold)!important}
.lineup{border:1px solid #355166;background:#08121c;border-radius:18px;overflow:hidden;margin:15px 0}
.lineup svg{width:100%;display:block;height:auto}
.toast{margin:10px 0;color:var(--green);font-weight:800;font-size:.78rem}
footer{text-align:center;color:#75879a;font-size:.68rem;margin:15px 0 0}
.spinner{width:42px;height:42px;border:4px solid #28404d;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:600px){.shell{min-height:calc(100vh - 40px);margin:20px auto;border-radius:27px;border:1px solid #203044}.login{min-height:calc(100vh - 40px)}}
</style>
</head>

let old={};try{old=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
let s={...defaults,...old,checks:old.checks||{}};
const routes=["setup","map","lease","fees","inspection","design","finish"];
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function logoBig(){return `<img class="logo-big" src="${LOGO}" alt="Sodaro logo">`}
function header(){return `<header><div class="brand"><img class="logo-small" src="${LOGO}" alt=""><strong>SODARO</strong></div><div class="avatar">${esc((s.user||"S").slice(0,1).toUpperCase())}</div></header>`}
function prog(){let n=routes.indexOf(s.route);if(n<0)n=0;return `<div class="row"><span class="kicker">Oakland storefront journey</span><span class="kicker">Step ${n+1} of 7</span></div><div class="progress"><i style="width:${Math.round((n+1)/7*100)}%"></i></div>`}
function nav(){return `<div class="row" style="gap:8px;margin-top:16px"><button class="btn secondary small" data-action="back">← Back</button><button class="btn small" data-action="next">${s.route==="design"?"Finish my store":"Continue →"}</button></div>`}
function check(id,text){return `<label class="check"><input type="checkbox" data-check="${id}" ${s.checks[id]?"checked":""}><span>${text}</span></label>`}
function pick(key,val,title,desc=""){return `<button class="pick ${s[key]===val?"active":""}" data-action="pick" data-key="${key}" data-value="${val}"><i class="dot"></i><span><strong>${title}</strong>${desc?`<small>${desc}</small>`:""}</span></button>`}
function link(label,url){return `<a class="link" target="_blank" rel="noopener noreferrer" href="${url}"><span>${label}</span><span>↗</span></a>`}

function login(){return `<main class="login">${logoBig()}<section class="card"><div class="eyebrow">Sodaro storefront builder</div><h1>Let’s build your store.</h1><p class="sub">Start with an empty space. Make choices, see your costs, and plan your next steps with Oakland.</p><form id="loginForm"><div class="field"><label for="user">Username</label><input id="user" name="user" value="${esc(s.user)}" autocomplete="username" required></div><div class="field"><label for="pass">Password</label><input id="pass" name="pass" type="password" placeholder="Enter password" autocomplete="current-password" required></div><button class="btn">Sign in to Sodaro →</button></form><p class="note" style="margin:12px 0 0">Demo sign-in only. Your password is not checked or saved. This prototype does not send applications or payments.</p></section></main>`}
function loading(){return `<main class="login" style="text-align:center">${logoBig()}<div class="spinner"></div><h2>Opening your Oakland path…</h2><p>Getting your storefront ready.</p></main>`}
function setup(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Start with a blank space</div><h1>What will you build?</h1><p class="sub">Give your store a name, choose your starting money, and set an interior budget.</p>${blankStore()}
 <section class="card"><div class="field"><label for="business">What is your business name?</label><input id="business" data-field="business" placeholder="Type the name for your storefront sign" value="${esc(s.business)}"></div>
 <label>What kind of business?</label><div class="chips">${[["food","Food / café"],["retail","Retail / market"],["service","Service"],["other","Other"]].map(([v,t])=>`<button class="chip ${s.kind===v?"active":""}" data-action="pick" data-key="kind" data-value="${v}">${t}</button>`).join("")}</div></section>
 <section class="card card cyan"><div class="eyebrow">Your starting money</div><h2>How much do you have to start?</h2><div class="picks">${[["under","Under $2,500"],["2to10","$2,500–$10,000"],["10to25","$10,000–$25,000"],["25to50","$25,000–$50,000"],["over50","$50,000+"],["unsure","Still figuring it out"]].map(([v,t])=>pick("cash",v,t)).join("")}</div>

 <p class="note">These are planning choices. No bank account is connected.</p></section>${nav()}</main>`}
function mapPage(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Choose where to look</div><h1>Pick an Oakland area.</h1><p class="sub">Use your Sodaro map as a starting point, then check the address and permitted use before signing.</p><section class="card" style="padding:9px"><img class="mapimg" src="${MAP}" alt="Sodaro Oakland neighborhood map"><p class="mapnote">Concept map image you shared. Its sample figures and colors are not live City data or an official zoning map.</p></section>
 <section class="card"><h2>Which area are you considering?</h2><div class="chips">${["West Oakland","Downtown","North Oakland","East Oakland","Fruitvale","Central East Oakland","Coliseum / Airport","Still exploring"].map(a=>`<button class="chip ${s.area===a?"active":""}" data-action="area" data-value="${a}">${a}</button>`).join("")}</div>
 <div class="field"><label for="address">Store address (if you have one)</label><input id="address" data-field="address" placeholder="Add an address later" value="${esc(s.address)}"></div></section>
 <div class="callout">Before you commit: Oakland requires zoning clearance for the business activity at the specific location. A separate clearance may be needed for each location.</div>${link("Oakland zoning clearance", "https://www.oaklandca.gov/Planning-Building/Your-Commercial-Projects-Permits/Zoning-Clearance-Permit")}${nav()}</main>`}
function leasePage(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Storefront & lease</div><h1>Check the space before you sign.</h1><p class="sub">Get the full cost and allowed use in writing. The lease can shape what you can build inside.</p>
 <section class="card">${blankStore()}<div class="field"><label for="rent">Monthly rent estimate</label><input id="rent" data-field="rent" inputmode="decimal" placeholder="$0" value="${esc(s.rent)}"></div><div class="field"><label for="deposit">Lease deposit estimate</label><input id="deposit" data-field="deposit" inputmode="decimal" placeholder="$0" value="${esc(s.deposit)}"></div>
 ${check("lease_use","Confirm your planned business is allowed at this address.")}${check("lease_allin","Ask about rent increases, common-area costs, utilities, deposit, and repairs.")}${check("lease_build","Check who approves interior changes and who pays for repairs.")}${check("lease_terms","Review the lease term, renewal, personal guarantee, and exit rules.")}</section>
 <div class="callout">Ask the landlord which business name should be on the lease. Consider having a commercial lease advisor review the agreement before signing.</div>${nav()}</main>`}
function feePage(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Know the costs</div><h1>Oakland fees, up front.</h1><p class="sub">Current published fees for FY 2026–27. City, California, and County charges are separated.</p>
 <section class="card card cyan"><div class="eyebrow">Example baseline</div><div class="total">$1,169.10</div><p class="small" style="margin:0">Example for an Oakland storefront, a California LLC, no employees, and the minimum first-year City tax estimate. This does not include fire, construction, food permits, rent, or interior work.</p></section>
 <section class="card"><h2>Oakland City costs <span class="tag city">CITY</span></h2>
 <div class="fee"><div><strong>Zoning clearance</strong><span>For business license at one Oakland location.</span></div><b>$107.10</b></div>
 <div class="fee"><div><strong>New business registration</strong><span>Standard “all other classifications” application; due within 30 days of start.</span></div><b>$112</b></div>
 <div class="fee"><div><strong>First-year business tax estimate</strong><span>Based on business type and estimated Oakland receipts; the City form lists $60 minimum.</span></div><b>$60 min.</b></div>
 <div class="fee"><div><strong>Employee fee</strong><span>For Oakland-based businesses, if applicable.</span></div><b>$6.70 each</b></div>
 <p class="note">City tax can be higher than the minimum. The amount depends on business classification and receipts.</p></section>
 <section class="card"><h2>California LLC costs <span class="tag state">STATE</span></h2>
 <div class="fee"><div><strong>LLC Articles of Organization</strong><span>California Secretary of State filing.</span></div><b>$70</b></div>
 <div class="fee"><div><strong>Statement of Information</strong><span>Due within 90 days, then every two years.</span></div><b>$20</b></div>
 <div class="fee"><div><strong>Annual California LLC tax</strong><span>Generally due while the LLC is active or doing business in California.</span></div><b>$800 / year</b></div>
 <p class="note">These are State fees and tax, not City of Oakland fees. Extra LLC fees can apply at higher California income levels.</p></section>
 <section class="card card pink"><h2>Official fee references</h2>
 ${link("Oakland FY 2026–27 zoning fee schedule","https://www.oaklandca.gov/files/assets/city/v/10/planning-amp-building/documents/pc/permit-process/zoning-fee-2026-2027-10072026.pdf")}
 ${link("Oakland new business application","https://www.oaklandca.gov/files/assets/city/v/2/finance/documents/business/tax-license-permits/2026-new-business-application-06-29-26.pdf")}
 ${link("California Secretary of State LLC fees","https://www.sos.ca.gov/business-programs/cannabizfile/cannabis-forms-and-fees/limited-liability-companies-llc-california")}
 ${link("California Franchise Tax Board LLC tax","https://www.ftb.ca.gov/file/business/types/limited-liability-company/")}
 </section>${nav()}</main>`}
function inspectionPage(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Inspections & permits</div><h1>Plan for the checks your store needs.</h1><p class="sub">The required inspections depend on your building work, business type, and occupancy.</p>
 <section class="card"><h2>Oakland Fire annual inspection <span class="tag city">IF REQUIRED</span></h2>
 <div class="fee"><div><strong>Regular hours</strong><span>$392 per hour, 2.5-hour minimum.</span></div><b>$980 min.</b></div>
 <div class="fee"><div><strong>After hours</strong><span>$550 per hour, 2.5-hour minimum.</span></div><b>$1,375 min.</b></div>
 <div class="fee"><div><strong>Annual Fire permit</strong><span>Depends on permit type.</span></div><b>$392–$1,082</b></div>
 <p class="note">These Fire rates apply to the City’s annual inspection request process. They are not a flat charge for every store or every inspection.</p>
 ${link("Oakland Fire annual inspection fee form","https://www.oaklandca.gov/files/assets/city/v/1/fire/documents/fire-code-amp-inspections/in-take-form-annual-insp-request-2026-2027-final.pdf")}</section>
 <section class="card"><h2>Building inspections <span class="tag city">IF BUILDING WORK</span></h2>
 <p class="small">Oakland’s building permit cost depends on the project. The City says building permit fees are usually about 4–6% of project value. The number of inspections included depends on the permit valuation; there is no one price for every building inspection visit.</p>
 ${link("Oakland inspection scheduling and requirements","https://www.oaklandca.gov/Planning-Building/Building-Construction-Permits-Inspections/Building-Inspections/Schedule-Your-Building-Inspection")}
 ${link("Oakland Planning & Building fee schedules","https://www.oaklandca.gov/Planning-Building/Permit-Process-Overview/Planning-Building-Permit-Fees-Project-Requirements")}</section>
 ${s.kind==="food"?`<section class="card"><h2>Food safety permits <span class="tag county">ALAMEDA COUNTY</span></h2><p class="small">Food facility permits and inspections are handled by Alameda County, not Oakland City. Cost depends on the kind and size of the food business and plan review.</p>${link("Alameda County food permit portal","https://permit.acgov.org/FoodPermit.aspx")}</section>`:""}
 <section class="card card cyan"><div class="eyebrow">Quick practice</div><h2>Would you pass this check?</h2><p class="small">A delivery box blocks the exit path.</p><div class="chips"><button class="chip ${s.practice==="ready"?"active":""}" data-action="practice" data-value="ready">Looks ready</button><button class="chip ${s.practice==="attention"?"active":""}" data-action="practice" data-value="attention">Needs attention</button></div>${s.practice?`<p class="toast ${s.practice==="attention"?"":"bad"}">${s.practice==="attention"?"Correct. Keep exits and walkways clear.":"Try again: exits and walkways should stay clear."}</p>`:""}</section>
 <p class="note">This practice card is for learning. It is not an official inspection result.</p>${nav()}</main>`}
function designPage(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Your creative choices</div><h1>Make the inside feel like your store.</h1><p class="sub">Choose a direction. Your interior budget and business name stay with your plan.</p>
 <section class="card"><div class="row"><div><div class="kicker">Store name</div><strong>${esc(s.business||"Your Oakland store")}</strong></div><div class="stepnum">✦</div></div><p class="small" style="margin:10px 0 0">Interior budget: <strong>${esc(s.interiorBudget||"Not set")}</strong></p>
 <div class="themegrid">${[["warm","Warm & natural","#f3e8d5","#db7953","#754c3b"],["bold","Bright & bold","#e7e9ff","#e5569d","#50447f"],["calm","Calm & welcoming","#e3f1ec","#e8ab50","#3d746d"]].map(([v,t,a,b,c])=>`<button class="theme ${s.theme===v?"active":""}" data-action="theme" data-value="${v}"><span class="swatches"><i style="background:${a}"></i><i style="background:${b}"></i><i style="background:${c}"></i></span>${t}</button>`).join("")}</div>

 <div class="field"><label for="vibe">What do you want customers to feel?</label><textarea id="vibe" data-field="vibe" placeholder="Cozy, lively, peaceful, welcoming…">${esc(s.vibe)}</textarea></div></section>
 <div class="callout">Before painting or building, check the lease, landlord approval, zoning, and permits. Your vision is yours; the City’s approval steps still apply.</div>${nav()}</main>`}
function finish(){return `<main class="page">${header()}${prog()}<div class="eyebrow">Your first build is complete</div><h1>${esc(s.business||"Your store")} is ready to meet the neighborhood.</h1><p class="sub">Here’s your storefront vision in ${esc(s.area||"Oakland")}.</p><div class="lineup look-${esc(s.theme)}">${finishStore().replace('class="lineup"','')}</div>
 <section class="card card cyan"><div class="row"><div><div class="eyebrow">Your plan</div><h2>Storefront concept complete ✓</h2></div><div class="stepnum">✓</div></div><p class="small">Name on sign: <strong>${esc(s.business||"Your store")}</strong><br>Interior budget: <strong>${esc(s.interiorBudget||"Not set")}</strong><br>Area: <strong>${esc(s.area||"Oakland")}</strong></p></section>
 <div class="callout">This is your prototype’s finished vision. It does not sign a lease, form an LLC, pay fees, or receive City approval. Use the official fee links in Sodaro as you move through the real process.</div>
 <button class="btn secondary" data-action="restart">Edit my plan</button><footer>You choose the vision. Oakland’s official process decides what can open.</footer></main>`}
function render(){let body="";
 if(s.route==="login")body=login();
 else if(s.route==="loading")body=loading();
 else if(s.route==="setup")body=setup();
 else if(s.route==="map")body=mapPage();
 else if(s.route==="lease")body=leasePage();
 else if(s.route==="fees")body=feePage();
 else if(s.route==="inspection")body=inspectionPage();
 else if(s.route==="design")body=designPage();
 else body=finish();
 document.getElementById("app").innerHTML=`<div class="shell">${body}</div>`;
}
function updateSign(){document.querySelectorAll(".business-sign").forEach(x=>x.textContent=s.business||"YOUR STORE")}
document.addEventListener("submit",e=>{if(e.target.id!=="loginForm")return;e.preventDefault();const f=new FormData(e.target);s.user=String(f.get("user")||"khmerxbxboi").trim();s.logged=true;s.route="loading";save();render();setTimeout(()=>{s.route="setup";save();render()},900)});
document.addEventListener("input",e=>{const x=e.target;if(x.dataset.field){s[x.dataset.field]=x.value;save();if(x.dataset.field==="business"){document.querySelectorAll(".shopname").forEach(el=>el.textContent=s.business||"YOUR STORE")}}});
document.addEventListener("change",e=>{if(e.target.dataset.check){s.checks[e.target.dataset.check]=e.target.checked;save()}});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
 if(a==="pick"){s[b.dataset.key]=b.dataset.value;save();render()}
 else if(a==="area"){s.area=b.dataset.value;save();render()}
 else if(a==="theme"){s.theme=b.dataset.value;save();render()}
 else if(a==="practice"){s.practice=b.dataset.value;save();render()}
 else if(a==="next"){
  const order={setup:"map",map:"lease",lease:"fees",fees:"inspection",inspection:"design",design:"finish"};
  if(s.route==="map"&&!s.area){s.area="Still exploring"}
  s.route=order[s.route]||"finish";save();render()
 }else if(a==="back"){
  const order={map:"setup",lease:"map",fees:"lease",inspection:"fees",design:"inspection",finish:"design"};
  s.route=order[s.route]||"setup";save();render()
 }else if(a==="restart"){s.route="setup";save();render()}
});
render();
</script>
